name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxblood
          POSTGRES_PASSWORD: oxblood
          POSTGRES_DB: oxblood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oxblood -d oxblood_test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: MyPy
        run: mypy apps/api/app
      - name: Install scenario validation deps
        run: pip install jsonschema pyyaml
      - name: Validate scenario YAML
        run: python tools/validate_scenario.py examples/scenarios/
      - name: OpenAPI snapshot is current
        run: python tools/export_openapi.py --check
      - name: Pytest (API)
        run: pytest apps/api/tests tests
        env:
          OXBLOOD_TEST_DB_URL: postgresql+asyncpg://oxblood:oxblood@localhost:5432/oxblood_test

  migrations-postgres:
    # The test suite already migrates a real Postgres once per session; this job also checks, in a clean
    # database like production's, that the newest migration reverses and reapplies.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxblood
          POSTGRES_PASSWORD: oxblood
          POSTGRES_DB: oxblood
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oxblood -d oxblood" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OXBLOOD_DB_URL: postgresql+asyncpg://oxblood:oxblood@localhost:5432/oxblood
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . psycopg2-binary
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Newest migration reverses and reapplies
        run: |
          alembic downgrade -1
          alembic upgrade head
          alembic current

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types are current
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Real browser tests: the production web build, served by the API (Postgres + mock Proxmox).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oxblood
          POSTGRES_PASSWORD: oxblood
          POSTGRES_DB: oxblood_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oxblood -d oxblood_e2e" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DB_URL: postgresql+asyncpg://oxblood:oxblood@localhost:5432/oxblood_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "apps/api[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies and the browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install matplotlib, PyYAML and the API (the database diagrams read its models)
        run: pip install matplotlib pyyaml -e apps/api
      - name: Regenerate architecture diagrams
        run: python tools/gen_diagrams.py
      - name: Verify diagrams committed
        run: |
          # PNG bytes differ between matplotlib versions, so compare the set of files, not pixels:
          # a diagram the generator now produces (or no longer produces) means the commit is stale.
          if git status --porcelain assets/diagrams/ | grep -E '^(\?\?| D|D )'; then
            echo "::error::Architecture diagrams are out of date. Run 'python tools/gen_diagrams.py' locally and commit the new files."
            exit 1
          fi
