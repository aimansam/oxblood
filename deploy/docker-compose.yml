name: oxblood-cyber-drill

# Architecture: one FastAPI service serves the React UI at /app/ and the API under /api/.
# Single entry point for users: http://localhost:5000/app/

services:
  # FastAPI backend: the UI (/app/) and the API (/api/) on one port
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: oxblood/api:dev
    container_name: oxblood-api
    restart: unless-stopped
    ports:
      - "5000:8000"
    environment:
      OXBLOOD_ENV: ${OXBLOOD_ENV:-dev}
      OXBLOOD_LOG_LEVEL: ${OXBLOOD_LOG_LEVEL:-INFO}
      OXBLOOD_RANGE_HOST_RESERVE_MB: ${OXBLOOD_RANGE_HOST_RESERVE_MB:-2048}
      OXBLOOD_RANGE_SKIP_MEMORY_CHECK: ${OXBLOOD_RANGE_SKIP_MEMORY_CHECK:-false}
      OXBLOOD_DB_URL: postgresql+asyncpg://oxblood:${POSTGRES_PASSWORD:-oxblood}@postgres:5432/oxblood
      OXBLOOD_REDIS_URL: redis://redis:6379/0
      # R1: opt into the Redis-backed event bus. With multiple
      # uvicorn workers this is the only way to deliver SSE events
      # across workers. Single-worker deployments can leave this
      # unset (OXBLOOD_EVENT_BUS=memory).
      OXBLOOD_EVENT_BUS: ${OXBLOOD_EVENT_BUS:-memory}
      # Scenario catalog. The repo's examples/ is mounted read-only so the
      # API can sync them into the DB on startup.
      OXBLOOD_SCENARIOS_DIR: ${OXBLOOD_SCENARIOS_DIR:-/workdir/examples/scenarios}
      OXBLOOD_SYNC_ON_STARTUP: ${OXBLOOD_SYNC_ON_STARTUP:-true}
      # F3-prep credential login. See README.md §8 for the operator
      # guide. Set BOTH to bootstrap the first admin user on API
      # startup; empty defaults mean no auto-admin. Remove both vars
      # from the env after the first admin exists.
      OXBLOOD_BOOTSTRAP_ADMIN_SUB: ${OXBLOOD_BOOTSTRAP_ADMIN_SUB:-}
      OXBLOOD_BOOTSTRAP_ADMIN_PASSWORD: ${OXBLOOD_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Token TTL for /api/v1/auth/login (default 8h).
      OXBLOOD_LOGIN_TOKEN_TTL_S: ${OXBLOOD_LOGIN_TOKEN_TTL_S:-28800}
      OXBLOOD_TOKEN_SECRET: ${OXBLOOD_TOKEN_SECRET:-}
      PROXMOX_HOST: ${PROXMOX_HOST:-}
      PROXMOX_PORT: ${PROXMOX_PORT:-8006}
      PROXMOX_USER: ${PROXMOX_USER:-oxblood@pve}
      PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID:-}
      PROXMOX_TOKEN_SECRET: ${PROXMOX_TOKEN_SECRET:-}
      PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-true}
      PROXMOX_CLONE_STORAGE: ${PROXMOX_CLONE_STORAGE:-SSD-Backups}
      # Q22: orphan janitor. Off by default; flip to true in
      # deployments where stale VMs accumulate faster than humans
      # notice. See apps/api/app/core/config.py for full
      # semantics.
      OXBLOOD_ORPHAN_JANITOR_ENABLED: ${OXBLOOD_ORPHAN_JANITOR_ENABLED:-false}
      OXBLOOD_ORPHAN_JANITOR_INTERVAL_MIN: ${OXBLOOD_ORPHAN_JANITOR_INTERVAL_MIN:-30}
      OXBLOOD_ORPHAN_JANITOR_GRACE_MINUTES: ${OXBLOOD_ORPHAN_JANITOR_GRACE_MINUTES:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [oxblood-net]
    volumes:
      # Repo root mounted read-only so the api container can read scenario
      # YAMLs from /workdir/examples/scenarios at startup.
      - ${OXBLOOD_REPO_ROOT:-..}:/workdir:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: oxblood-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oxblood
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oxblood}
      POSTGRES_DB: oxblood
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [oxblood-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxblood -d oxblood"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oxblood-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    networks: [oxblood-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- observability -----------------------------------------------------
  #
  # Prometheus scrapes the api's /metrics endpoint every 15s.
  # Grafana reads from Prometheus and serves the starter dashboard
  # defined in deploy/grafana/dashboards/.
  #
  # Both are exposed on localhost only. In production, hide them behind the
  # oxblood-net bridge + put an authenticating reverse proxy in front.

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: oxblood-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks: [oxblood-net]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: oxblood-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [oxblood-net]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.3.0
    container_name: oxblood-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-oxblood}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
      # Provisioning is mounted from the repo (read-only). Datasource +
      # dashboard providers pick up new panels without a restart.
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [oxblood-net]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  oxblood-net:
    name: oxblood-net
    driver: bridge
