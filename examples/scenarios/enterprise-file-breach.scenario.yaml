apiVersion: oxblood/v1
kind: Scenario
metadata:
  name: enterprise-file-breach
  title: "Enterprise File Breach"
  organization: "Bank Harimau"
  summary: "Red attacks the public web host, then pivots through it into the internal network while Blue traces and contains the movement."
  version: 8
  difficulty: advanced
  duration_min: 120
  tags:
    - enterprise
    - active-directory
    - dmz
    - file-breach
    - log-investigation

spec:
  attack_path:
    - asset: dmz_gateway
      goal: "Compromise the web service on the public network"
    - asset: dc01
      goal: "Pivot through DMZ01 into the internal network"
    - asset: file_server
      goal: "Access protected files"
    - asset: backup_server
      goal: "Reach the backup service"
  play_guide:
    red:
      - "Browse http://DMZ01/ and read the page source for the API key; use it on GET /api/status/flag for the first capture."
      - "POST /api/exec to run commands on DMZ01; retrieve domain credentials from GET /api/config."
      - "Red has no route to the internal network; DMZ01 is the only bridge. From DMZ01 (or a tunnel through it), evil-winrm into DC01 (10.30.40.10:5985)."
      - "From inside, smbclient //FILE01/CompanyFiles -N for the file flag, then rsync rsync://BAK01/archives/ for the backup flag."
    blue:
      - "On BLUE01, work through the logs and evidence; find the first HTTP request to DMZ01 from 10.30.10.x and submit blue-initial-source with that IP."
      - "Look for WinRM (port 5985) inbound to DC01 from DMZ01's internal address (10.30.40.40); submit blue-pivot-traced with source IP and timestamp."
      - "Check BAK01 or FW01 logs for rsync (873) from dc01_vlan; block or log the path and submit blue-backup-protected."
  vulnerabilities:
    - asset: dmz_gateway
      issue: "Web admin API key embedded in HTML comment; privileged command-execution endpoint exposed."
      detail: >
        tpl-debian-dmz-docker ships a Docker-based Flask app on port 80 that includes the API key
        (X-API-Key: oxblood-admin-2024) in an HTML comment on the index page. Authenticated requests to
        GET /api/status/flag read and return /opt/oxblood/flags/red-dmz-foothold.txt (service runs as root).
        POST /api/exec runs arbitrary shell commands as root on the DMZ host, enabling lateral movement.
        GET /api/config returns the domain service-account credential (svc_app / AppSvc@2024!) used for
        the next pivot. The web access log on DMZ01 records every request.

    - asset: dc01
      issue: "Domain service account svc_app is in Remote Management Users; WinRM enabled on port 5985."
      detail: >
        tpl-win2022-ad-auto creates svc_app@oxblood.lab with password AppSvc@2024! and adds it to
        Remote Management Users. Attackers who discover the credential on DMZ01 can evil-winrm into
        DC01 (10.30.40.10:5985) from DMZ01, the only host with a leg in the internal network. No PSRemoting restriction is applied.
        Windows Defender and sysmon log the inbound WinRM session.

    - asset: file_server
      issue: "Samba share CompanyFiles uses force user=root and guest ok=yes."
      detail: >
        tpl-debian-file-server configures /etc/samba/smb.conf with a [CompanyFiles] share at
        path /opt/oxblood/flags, force user = root, guest ok = yes, read only = yes. Any host on
        dc01_vlan can retrieve flag files without credentials:
        smbclient //FILE01/CompanyFiles -N -c 'get red-file-access.txt /tmp/flag.txt'

    - asset: backup_server
      issue: "rsyncd exposes an unauthenticated read-only module that serves the flags directory."
      detail: >
        tpl-debian-backup-server ships /etc/rsyncd.conf with module [archives] pointing to
        /opt/oxblood/flags, uid=root, gid=root, read only=yes, list=yes, no auth users set.
        Any host on dc01_vlan (routed to backup_vlan on 873) can enumerate and pull flag files:
        rsync rsync://BAK01/archives/
        rsync rsync://BAK01/archives/red-backup-access.txt /tmp/
        rsyncd on BAK01 logs the access to syslog.
  provisioning:
    # Shared backing disks keep this seven-VM enterprise range inside the
    # available SSD capacity. Every run is still destroyed during cleanup.
    mode: linked_clone
    linked_clone_reserve_mb: 1024
    auto_baseline: true
  objectives:
    red:
      - "Reach the DMZ web service from the red workstation."
      - "Pivot from the DMZ toward the protected DC01 enterprise segment."
      - "Reach the protected file and backup services."
      - "Submit the web, file, and backup flags."
    blue:
      - "Use host logs and the blue console to identify the initial foothold."
      - "Trace the pivot from DMZ to the identity segment."
      - "Contain the compromised path before backup access."
      - "Submit the source, pivot, and containment flags with evidence."

  networks:
    # The public network: the red workstation and the exposed web host share it.
    - name: public_vlan
      cidr: 10.30.10.0/24
      vlan_id: 230
      isolation: loose
      egress: restricted
      dhcp: true
    - name: dc01_vlan
      cidr: 10.30.40.0/24
      vlan_id: 234
      isolation: tight
      egress: blocked
      dhcp: false
    - name: backup_vlan
      cidr: 10.30.60.0/24
      vlan_id: 236
      isolation: tight
      egress: blocked
      dhcp: false
  assets:
    - role: red_workstation
      vm_name: RED01
      restore_commands: ["netplan apply"]
      kind: vm
      template: tpl-kali-gui-xrdp
      networks: [public_vlan]
      exposed: true
      resources:
        cores: 2
        ram_mb: 2048
        disk_gb: 32

    - role: router_fw
      vm_name: FW01
      kind: vm
      template: tpl-opnsense
      network_mode: trunk
      networks: [public_vlan, dc01_vlan, backup_vlan]
      resources:
        cores: 2
        ram_mb: 1024
        disk_gb: 16

    - role: dmz_gateway
      vm_name: DMZ01
      kind: vm
      template: tpl-debian-dmz-docker
      # Dual-homed: public side (net0) for red, internal side (net1) for the pivot.
      networks: [public_vlan, dc01_vlan]
      resources:
        cores: 2
        ram_mb: 1024
        disk_gb: 20

    - role: dc01
      vm_name: DC01
      kind: vm
      template: tpl-win2022-ad-auto
      networks: [dc01_vlan]
      resources:
        cores: 4
        ram_mb: 8192
        disk_gb: 60
      windows_setup:
        verify:
          ip: 10.30.40.10
          domain: oxblood.lab
          controller: primary
        phases:
          - name: configure-dc01
            timeout_seconds: 600
            reboot: true
            commands:
              - "$ErrorActionPreference = 'Stop'"
              - "pnputil.exe /scan-devices *> $null"
              - "Get-NetAdapter -Physical -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Disabled' } | Enable-NetAdapter -Confirm:$false -ErrorAction SilentlyContinue"
              - "$nicAddress = $null"
              - "for ($attempt = 0; $attempt -lt 60 -and -not $nicAddress; $attempt++) { $nicAddress = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.InterfaceIndex -gt 1 -and $_.IPAddress -notlike '127.*' } | Sort-Object InterfaceIndex | Select-Object -First 1; if (-not $nicAddress) { Start-Sleep -Seconds 5 } }"
              - "if (-not $nicAddress) { $adapters = @(Get-NetAdapter -IncludeHidden -ErrorAction SilentlyContinue | ForEach-Object { \"$($_.Name): $($_.Status) ($($_.InterfaceDescription))\" }); $pnp = @(Get-PnpDevice -Class Net -ErrorAction SilentlyContinue | ForEach-Object { \"$($_.FriendlyName): $($_.Status)\" }); throw \"No usable IPv4 interface after waiting. adapters=[$($adapters -join ', ')] PnP=[$($pnp -join ', ')]\" }"
              - "$ifIndex = [int]$nicAddress.InterfaceIndex"
              - "$targetIp = '10.30.40.10'"
              - "$current = Get-NetIPAddress -InterfaceIndex $ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue"
              - "if (-not ($current | Where-Object IPAddress -eq $targetIp)) { Set-NetIPInterface -InterfaceIndex $ifIndex -Dhcp Disabled -ErrorAction SilentlyContinue; $current | Where-Object { $_.IPAddress -ne '127.0.0.1' } | Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue; Get-NetRoute -InterfaceIndex $ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.DestinationPrefix -ne '255.255.255.255/32' } | Remove-NetRoute -Confirm:$false -ErrorAction SilentlyContinue; New-NetIPAddress -InterfaceIndex $ifIndex -IPAddress $targetIp -PrefixLength 24 -DefaultGateway 10.30.40.1 -ErrorAction Stop }"
              - "Set-DnsClientServerAddress -InterfaceIndex $ifIndex -ServerAddresses 10.30.40.10"
              - "net user Administrator '{{domain_password}}'"
              - "Rename-Computer -NewName DC01 -Force"
          - name: install-dc01-roles
            timeout_seconds: 600
            reboot: true
            commands:
              - "Install-WindowsFeature -Name AD-Domain-Services,DNS -IncludeManagementTools -ErrorAction Stop | Out-Null"
          - name: promote-dc01
            timeout_seconds: 900
            reboot: true
            commands:
              - "$pw = ConvertTo-SecureString '{{domain_password}}' -AsPlainText -Force"
              - "Install-ADDSForest -DomainName oxblood.lab -DomainNetbiosName OXBLOOD -SafeModeAdministratorPassword $pw -InstallDns -NoRebootOnCompletion -Force"
          - name: confirm-dc01-address
            timeout_seconds: 300
            commands:
              - "$ErrorActionPreference = 'Stop'"
              - "$adapter = @(Get-NetAdapter -Physical -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Up' } | Sort-Object InterfaceIndex | Select-Object -First 1)"
              - "if (-not $adapter) { $adapter = @(Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Up' -and $_.InterfaceDescription -notmatch 'Loopback|Teredo|ISATAP|WAN Miniport' } | Sort-Object InterfaceIndex | Select-Object -First 1) }"
              - "if (-not $adapter) { throw 'No active physical network adapter after domain promotion' }"
              - "$ifIndex = [int]$adapter.InterfaceIndex"
              - "$targetIp = '10.30.40.10'"
              - "$current = Get-NetIPAddress -InterfaceIndex $ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue"
              - "if (-not ($current | Where-Object IPAddress -eq $targetIp)) { Set-NetIPInterface -InterfaceIndex $ifIndex -Dhcp Disabled -ErrorAction SilentlyContinue; $current | Where-Object { $_.IPAddress -ne '127.0.0.1' } | Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue; Get-NetRoute -InterfaceIndex $ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.DestinationPrefix -ne '255.255.255.255/32' } | Remove-NetRoute -Confirm:$false -ErrorAction SilentlyContinue; New-NetIPAddress -InterfaceIndex $ifIndex -IPAddress $targetIp -PrefixLength 24 -DefaultGateway 10.30.40.1 -ErrorAction Stop }"
              - "Set-DnsClientServerAddress -InterfaceIndex $ifIndex -ServerAddresses 10.30.40.10"
          - name: create-service-account
            timeout_seconds: 120
            commands:
              - "$ErrorActionPreference = 'Stop'"
              - "$pw = ConvertTo-SecureString 'AppSvc@2024!' -AsPlainText -Force"
              - "if (-not (Get-ADUser -Filter {SamAccountName -eq 'svc_app'} -ErrorAction SilentlyContinue)) { New-ADUser -SamAccountName svc_app -Name 'App Service Account' -AccountPassword $pw -PasswordNeverExpires $true -Enabled $true -ErrorAction Stop }"
              - "Add-ADGroupMember -Identity 'Remote Management Users' -Members svc_app -ErrorAction SilentlyContinue"

    - role: file_server
      vm_name: FILE01
      kind: vm
      template: tpl-debian-file-server
      networks: [dc01_vlan]
      resources:
        cores: 2
        ram_mb: 1024
        disk_gb: 24

    - role: backup_server
      vm_name: BAK01
      kind: vm
      template: tpl-debian-backup-server
      networks: [backup_vlan]
      resources:
        cores: 2
        ram_mb: 1024
        disk_gb: 24

    - role: blue_workstation
      vm_name: BLUE01
      kind: vm
      template: tpl-debian-blue-gui-xrdp
      networks: [dc01_vlan]
      exposed: true
      resources:
        cores: 2
        ram_mb: 1536
        disk_gb: 24

  routing_policy:
    default_forward: drop
    # No rule joins public_vlan to the internal networks: DMZ01 is the only way in.
    rules:
      - {from: dc01_vlan, to: backup_vlan, protocol: tcp, ports: [22, 443, 873]}

  flags:
    - id: red-dmz-foothold
      side: red
      value: "FLAG{enterprise_dmz_foothold}"
      planted_on_role: dmz_gateway
      objective: "Reach the DMZ web service."
      decay_window_seconds: 7200
      base_points: 100
    - id: red-file-access
      side: red
      value: "FLAG{enterprise_file_access}"
      planted_on_role: file_server
      objective: "Reach the protected file service."
      decay_window_seconds: 7200
      base_points: 150
    - id: red-backup-access
      side: red
      value: "FLAG{enterprise_backup_access}"
      planted_on_role: backup_server
      objective: "Reach the backup service."
      decay_window_seconds: 7200
      base_points: 200
    - id: blue-initial-source
      side: blue
      value: "FLAG{enterprise_source_identified}"
      planted_on_role: blue_workstation
      objective: "Identify the initial source."
      decay_window_seconds: 7200
      base_points: 120
    - id: blue-pivot-traced
      side: blue
      value: "FLAG{enterprise_pivot_traced}"
      planted_on_role: blue_workstation
      objective: "Trace the DMZ-to-identity pivot."
      decay_window_seconds: 7200
      base_points: 160
    - id: blue-backup-protected
      side: blue
      value: "FLAG{enterprise_backup_protected}"
      planted_on_role: blue_workstation
      objective: "Contain the backup path."
      decay_window_seconds: 7200
      base_points: 180

  validation:
    probes:
      # The control-plane API intentionally has no route into the isolated
      # exercise VLANs. These readiness checks therefore use PVE's machine
      # state; in-range service verification is performed from Blue's
      # workstation during the drill.
      - {id: dc01-online, label: "DC01 is running", type: role_running, role: dc01, side: shared}
      - {id: red-desktop-online, label: "Red workstation is running", type: role_running, role: red_workstation, side: red}
      - {id: blue-desktop-online, label: "Blue workstation is running", type: role_running, role: blue_workstation, side: blue}
      - {id: blue-address, label: "Blue workstation address assigned", type: role_address, role: blue_workstation, side: blue}
      - {id: flags-loaded, label: "Scenario flags loaded", type: flag_seeded, side: shared}
      - {id: objectives-loaded, label: "Mission objectives loaded", type: objectives_seeded, side: shared}
      - {id: telemetry-config, label: "Telemetry configured (not a live check)", type: telemetry_declared, required: false, side: shared}

  telemetry:
    sinks:
      - type: stdout
        channels: [pcap, web_access, authentication, system]

  artifacts:
    sink_to: local
    required_pcaps: [public_vlan, dc01_vlan, backup_vlan]
    retention_days: 30

  win_conditions:
    red:
      - "Red submits the DMZ, file, and backup flags."
    blue:
      - "Blue submits the source, pivot, and backup-protection flags."

  scoring:
    red:
      rules:
        - id: dmz_foothold
          weight: 25
        - id: file_access
          weight: 30
        - id: backup_access
          weight: 45
      pass_threshold: 70
    blue:
      rules:
        - id: source_identified
          weight: 30
        - id: pivot_traced
          weight: 30
        - id: backup_protected
          weight: 40
      pass_threshold: 70
