# OxBlood Alembic config.
# Usage:  alembic -c apps/api/alembic.ini upgrade head

[alembic]
# Absolute path (via ``%(here)s``) so alembic works regardless of cwd
# (the CLI tools run from the repo root, the tests from apps/api/).
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os
# The URL comes from OXBLOOD_DB_URL (see alembic/env.py); this value is only a placeholder.
sqlalchemy.url = postgresql+psycopg2://oxblood:oxblood@localhost:5432/oxblood

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
